<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Spilsamlingen</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="search.css" />
</head>
<body>
  <div class="page-header">
    <h1>Spilsamlingen</h1>
  </div>

  <div class="emu-picker" id="emuPicker">
    <button type="button" class="emu-picker-title" id="emuPickerToggle" onclick="toggleEmuPicker()" aria-expanded="false" aria-controls="emuColumns">
      <span>&#127918; Spil et emuleret spil&hellip;</span>
      <span class="emu-picker-arrow" aria-hidden="true">&#9662;</span>
    </button>
    <div id="emuColumns" class="emu-columns"></div>
  </div>

  <input id="searchBox" type="text" placeholder="Enter query and press Enter (e.g. *:*)" />

  <div class="layout">
    <div id="facets" class="facets"></div>
    <div id="results" class="results"></div>
  </div>

  <div id="tooltip" class="tooltip-box"></div>

  <div id="imageModalOverlay" class="image-modal-overlay" onclick="closeImageModal()">
    <img id="imageModalImg" src="" alt="Full size cover" />
  </div>

  <script>
    // Resolve the search API relative to wherever this page itself was
    // loaded from (protocol, host, port, and webapp context path all come
    // along for free) — so this never has to be hand-edited per server
    // again, no matter what host/port the app is deployed on.
    const SOLR_URL = new URL('v1/search', window.location.href).href;
    const ROWS_PER_PAGE = 10;
    let currentQuery = "*:*";
    let currentStart = 0;
    let totalFound = 0;

    const searchBox = document.getElementById('searchBox');
    const resultsDiv = document.getElementById('results');
    const facetsDiv = document.getElementById('facets');
    const tooltip = document.getElementById('tooltip');
    let pinnedElement = null;

    searchBox.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        currentQuery = searchBox.value || '*:*';
        currentStart = 0;
        performSearch();
      }
    });

    async function performSearch() {
      resultsDiv.innerHTML = 'Loading...';
      facetsDiv.innerHTML = '';

      const params = new URLSearchParams({
        q: currentQuery,
        wt: 'json',
        rows: ROWS_PER_PAGE.toString(),
        start: currentStart.toString(),
        facet: 'true',
        'facet.field': ['category', 'author']
      });

      try {
        const res = await fetch(`${SOLR_URL}?${params.toString()}`);
        const data = await res.json();
        if (!data.response || !Array.isArray(data.response.docs)) {
          resultsDiv.innerHTML = '<em>Unexpected Solr response — no response.docs found.</em>';
          return;
        }
        totalFound = data.response.numFound || 0;
        renderFacets(data.facet_counts || {});
        renderResults(data.response);
      } catch (err) {
        resultsDiv.innerHTML = `<span style="color:crimson">Error: ${err.message}</span>`;
      }
    }

    function renderFacets(facetCounts) {
      if (!facetCounts || !facetCounts.facet_fields) {
        facetsDiv.innerHTML = '<em>No facets</em>';
        return;
      }
      const fields = facetCounts.facet_fields;
      let html = '<h3 style="margin-top:0">Facets</h3>';
      for (const [field, values] of Object.entries(fields)) {
        if (!values || values.length === 0) continue;
        html += `<div class="facet-block"><div class="facet-title">${escapeHtml(field)}</div><div>`;
        for (let i = 0; i < values.length; i += 2) {
          const val = values[i];
          const count = values[i + 1];
          html += `<span class="facet-value" data-field="${escapeHtml(field)}" data-value="${escapeHtml(val)}">${escapeHtml(val)} <span class="badge">${count}</span></span>`;
        }
        html += `</div></div>`;
      }
      facetsDiv.innerHTML = html;

      facetsDiv.querySelectorAll('.facet-value').forEach(el => {
        el.addEventListener('click', () => {
          facetSearch(buildFacetQuery(el.getAttribute('data-field'), el.getAttribute('data-value')));
        });
      });
    }

    // Builds a Solr field query, quoting the value so multi-word facet
    // values (e.g. "puzzle video game") are matched as a phrase rather
    // than as separate terms. Escapes backslashes/quotes for Solr syntax.
    function buildFacetQuery(field, val) {
      const escaped = String(val).replace(/([\\"])/g, '\\$1');
      return `${field}:"${escaped}"`;
    }

    function facetSearch(query) {
      currentQuery = query;
      currentStart = 0;
      searchBox.value = query;
      performSearch();
    }

    function renderResults(response) {
      const docs = response.docs || [];
      if (docs.length === 0) {
        resultsDiv.innerHTML = '<em>No results</em>';
        return;
      }

      const header = `<div style="margin-bottom:8px"><strong>Showing ${currentStart + 1}-${Math.min(currentStart + docs.length, totalFound)} of ${totalFound}</strong></div>`;
      const body = docs.map((doc, idx) => renderDoc(doc, idx)).join('');
      const pagination = renderPagination();

      resultsDiv.innerHTML = header + body + pagination;

      document.querySelectorAll('[data-full-value]').forEach(el => {
        el.addEventListener('mouseenter', showTooltip);
        el.addEventListener('mouseleave', hideTooltip);
        el.addEventListener('click', togglePinTooltip);
      });
    }

    function renderPagination() {
      const prevDisabled = currentStart <= 0;
      const nextDisabled = currentStart + ROWS_PER_PAGE >= totalFound;

      return `
        <div class="pagination">
          <button class="page-btn" ${prevDisabled ? 'disabled' : ''} onclick="changePage(-1)">Previous</button>
          <button class="page-btn" ${nextDisabled ? 'disabled' : ''} onclick="changePage(1)">Next</button>
        </div>
      `;
    }

    function changePage(direction) {
      const newStart = currentStart + direction * ROWS_PER_PAGE;
      if (newStart < 0 || newStart >= totalFound) return;
      currentStart = newStart;
      performSearch();
    }

    // Extensions to try, in order, for a game's cover image.
    const IMAGE_EXTENSIONS = ['jpg', 'png', 'gif', 'webp'];

    function getSpilId(doc) {
      let v = doc.spil_id;
      if (Array.isArray(v)) v = v[0];
      if (v === null || v === undefined || v === '') return null;
      return String(v);
    }

    function renderThumb(spilId, uniqueId) {
      if (!spilId) {
        return `<div class="game-thumb no-image">No image</div>`;
      }
      // data-ext-index tracks which extension we're currently trying via onerror.
      return `<img id="${uniqueId}" class="game-thumb" data-spil-id="${escapeHtml(spilId)}" data-ext-index="0"
                   src="images/${encodeURIComponent(spilId)}_1.${IMAGE_EXTENSIONS[0]}"
                   alt="Cover for game ${escapeHtml(spilId)}"
                   onerror="handleImageError(this)"
                   onclick="openImageModal(this.src)" />`;
    }

    function openImageModal(src) {
      const overlay = document.getElementById('imageModalOverlay');
      const img = document.getElementById('imageModalImg');
      img.src = src;
      overlay.style.display = 'flex';
    }

    function closeImageModal() {
      const overlay = document.getElementById('imageModalOverlay');
      overlay.style.display = 'none';
      document.getElementById('imageModalImg').src = '';
    }

    function handleImageError(img) {
      const nextIndex = parseInt(img.getAttribute('data-ext-index'), 10) + 1;
      const spilId = img.getAttribute('data-spil-id');
      if (nextIndex < IMAGE_EXTENSIONS.length) {
        img.setAttribute('data-ext-index', String(nextIndex));
        img.src = `images/${encodeURIComponent(spilId)}_1.${IMAGE_EXTENSIONS[nextIndex]}`;
        return;
      }
      // Exhausted every extension — swap the <img> for a plain "no image" placeholder.
      img.onerror = null;
      const placeholder = document.createElement('div');
      placeholder.className = 'game-thumb no-image';
      placeholder.textContent = 'No image';
      img.replaceWith(placeholder);
    }

    // Fields shown by default, and the order they're shown in. Everything
    // else on the doc is hidden behind a "Show more fields" toggle.
    const DEFAULT_FIELDS = ['titel', 'aar', 'udgiver', 'spillets_url', 'spil_id'];

    function renderField(key, rawValue) {
      const html = renderFieldValue(rawValue);
      return `
        <div style="padding:6px 0;">
          <span class="field-name">${escapeHtml(key)}</span>
          <div class="field-value">${html}</div>
        </div>`;
    }

    function renderDoc(doc, idx) {
      const spilId = getSpilId(doc);
      const docIndex = currentStart + idx;
      const thumbId = `thumb-${docIndex}`;
      const thumb = renderThumb(spilId, thumbId);

      const keysPresent = new Set(Object.keys(doc));
      const defaultKeys = DEFAULT_FIELDS.filter(k => keysPresent.has(k));
      const extraKeys = Object.keys(doc).filter(k => !DEFAULT_FIELDS.includes(k));

      const defaultPairs = defaultKeys.map(key => renderField(key, doc[key])).join('');
      const extraPairs = extraKeys.map(key => renderField(key, doc[key])).join('');

      const extraId = `extra-${docIndex}`;
      const extraSection = extraKeys.length === 0 ? '' : `
        <button class="toggle-fields-btn" onclick="toggleExtraFields('${extraId}')" id="${extraId}-btn">Show ${extraKeys.length} more fields</button>
        <div class="extra-fields" id="${extraId}">${extraPairs}</div>`;

      return `<div class="result-item">
        <div class="result-body">
          <div style="margin-bottom:6px"><strong>Document ${docIndex + 1}</strong></div>
          ${defaultPairs}
          ${extraSection}
        </div>
        ${thumb}
      </div>`;
    }

    function toggleExtraFields(extraId) {
      const el = document.getElementById(extraId);
      const btn = document.getElementById(`${extraId}-btn`);
      if (!el || !btn) return;
      const expanded = el.classList.toggle('expanded');
      const count = el.querySelectorAll('.field-name').length;
      btn.textContent = expanded ? 'Hide fields' : `Show ${count} more fields`;
    }

    function renderFieldValue(v) {
      if (v === null || v === undefined)
        return '<em>null</em>';
      if (Array.isArray(v))
        return renderArray(v);
      if (typeof v === 'object')
        return `<pre class="json-block">${escapeHtml(JSON.stringify(v, null, 2))}</pre>`;
      return renderTruncatedValue(v);
    }

    function renderArray(arr) {
      const items = arr.map(it => renderTruncatedValue(it, true)).join('');
      return `<ul class="field-list">${items}</ul>`;
    }

    function renderTruncatedValue(value, asListItem = false) {
      const valStr = String(value);
      const truncated = valStr.length > 50 ? valStr.substring(0, 50) + "…" : valStr;
      const escapedFull = escapeHtml(valStr);
      const escapedShort = escapeHtml(truncated);
      const html = `<span data-full-value="${escapedFull}">${escapedShort}</span>`;
      return asListItem ? `<li>${html}</li>` : html;
    }

    // Tooltip behavior
    function showTooltip(e) {
      if (pinnedElement && pinnedElement !== e.target) return;
      const full = e.target.getAttribute('data-full-value');
      if (!full || full.length <= 50) return;
      tooltip.textContent = full;
      positionTooltip(e.target);
      tooltip.style.display = 'block';
      tooltip.classList.toggle('tooltip-pinned', !!pinnedElement);
    }

    function hideTooltip(e) {
      if (pinnedElement === e.target) return;
      if (!pinnedElement) tooltip.style.display = 'none';
    }

    function togglePinTooltip(e) {
      const target = e.target;
      const full = target.getAttribute('data-full-value');
      if (!full || full.length <= 50) return;
      if (pinnedElement === target) {
        pinnedElement = null;
        tooltip.style.display = 'none';
        tooltip.classList.remove('tooltip-pinned');
      } else {
        pinnedElement = target;
        tooltip.textContent = full;
        tooltip.classList.add('tooltip-pinned');
        positionTooltip(target);
        tooltip.style.display = 'block';
      }
      e.stopPropagation();
    }

    document.addEventListener('click', (e) => {
      if (pinnedElement && !tooltip.contains(e.target) && e.target !== pinnedElement) {
        pinnedElement = null;
        tooltip.style.display = 'none';
        tooltip.classList.remove('tooltip-pinned');
      }
    });

    function positionTooltip(target) {
      const rect = target.getBoundingClientRect();
      tooltip.style.top = window.scrollY + rect.bottom + 5 + 'px';
      tooltip.style.left = Math.min(window.scrollX + rect.left, window.innerWidth - tooltip.offsetWidth - 20) + 'px';
    }

    // Hardcoded list of games with a working in-browser emulator (demo
    // prototype), grouped by platform for the column picker below. Opens
    // the emulator page in a new tab; each emulator page already defaults
    // to its own game when loaded with no query params.
    //
    // Paths, titles and the edition note are written here in plain,
    // human-readable form (real spaces, æøå, parens, brackets — no %20/%28
    // percent-encoding) so the list stays easy to read and edit. Encoding
    // for the URL only happens at the moment a link is opened, in
    // buildEmuUrl() below.
    const EMULATED_GAMES = [
      { platform: 'Commodore 64', label: 'Tiger Mission (T64)', page: 'c64-emulator.html' },
      { platform: 'Commodore 64', label: 'Tiger Mission (TAP)', page: 'c64-emulator.html', rom: 'roms/c64/Tiger_Mission.tap', title: 'Tiger Mission (TAP, 1987, Kele Line)' },
      { platform: 'Commodore 64', label: 'Al Capone', page: 'c64-emulator.html', rom: 'roms/c64/Al_Capone.t64', title: 'Al Capone' },
      { platform: 'Commodore 64', label: 'Army Force', page: 'c64-emulator.html', rom: 'roms/c64/Army_Force.t64', title: 'Army Force' },
      { platform: 'Commodore 64', label: 'Auto Duel', page: 'c64-emulator.html', rom: 'roms/c64/Auto_Duel.t64', title: 'Auto Duel' },
      { platform: 'Commodore 64', label: 'Balloon Samurai', page: 'c64-emulator.html', rom: 'roms/c64/Balloon_Samurai.t64', title: 'Balloon Samurai' },
      { platform: 'Commodore 64', label: 'Canon Command', page: 'c64-emulator.html', rom: 'roms/c64/Canon_Command.t64', title: 'Canon Command' },
      { platform: 'Commodore 64', label: 'Eskimo!', page: 'c64-emulator.html', rom: 'roms/c64/Eskimo.t64', title: 'Eskimo!' },
      { platform: 'Commodore 64', label: 'Falcons', page: 'c64-emulator.html', rom: 'roms/c64/Falcons.t64', title: 'Falcons' },
      { platform: 'Commodore 64', label: 'Flying Balls+', page: 'c64-emulator.html', rom: 'roms/c64/Flying_Balls_Plus.d64', title: 'Flying Balls+' },
      { platform: 'Commodore 64', label: 'Korea Karate', page: 'c64-emulator.html', rom: 'roms/c64/Korea_Karate.t64', title: 'Korea Karate' },
      { platform: 'Commodore 64', label: 'Madballs II', page: 'c64-emulator.html', rom: 'roms/c64/Madballs_II.d64', title: 'Madballs II' },
      { platform: 'Commodore 64', label: 'Vikings', page: 'c64-emulator.html', rom: 'roms/c64/VIKINGS.D64', title: 'Vikings' },
      { platform: 'DOS', label: 'Kaptajn Kaper i Kattegat', page: 'dos-emulator.html' },
      { platform: 'ZX Spectrum', label: 'Buggy Boy', page: 'spectrum-emulator.html', rom: 'roms/spectrum/Buggy_Boy_1988_Elite_Systems_a_128K.z80', title: 'Buggy Boy (1988, Elite Systems, 128K)' },
      { platform: 'Amiga', label: 'Battle Squadron', page: 'amiga-emulator.html', rom: 'roms/amiga/battle_squadron/Battle_Squadron.adf', title: 'Battle Squadron (1989, Innerprise Software)' },
      { platform: 'Amiga', label: 'Sword of Sodan (kun disk 1)', page: 'amiga-emulator.html', rom: 'roms/amiga/sword_of_sodan/Sword_of_Sodan_Disk1.adf', title: 'Sword of Sodan (1989, Discovery Software) – kun disk 1', edition: '<strong>Om denne udgave:</strong> Sword of Sodan blev oprindeligt udgivet på 4 disketter, og denne side viser lige nu kun <strong>disk 1 af 4</strong> (den rene udgave, ingen crack, ingen trainer/snyd-koder). Vi prøvede først at pakke alle 4 diske sammen med en .m3u-spilleliste, så emulatoren selv kunne skifte disk undervejs — men det ramte en bekræftet, endnu uløst fejl i EmulatorJS’ Amiga-kerne (<a href="https://github.com/EmulatorJS/EmulatorJS/issues/1260" target="_blank" rel="noopener">EmulatorJS-issue #1260</a>), som gør at spillet slet ikke starter, når der er mere end én disk i spil. Derfor kører siden nu kun disk 1, indtil den rigtige flerdiske-understøttelse er på plads. Det betyder, at du kan spille det første afsnit af spillet, men ikke komme videre, når spillet beder om disk 2.' },
      { platform: 'Amiga', label: 'Naughty Ones (AGA)', page: 'amiga-emulator.html', rom: 'roms/amiga/naughty_ones/Naughty Ones (1994)(Interactivision)(AGA)[cr PDX].adf', title: 'Naughty Ones (1994, Interactivision)', bios: 'amiga/kick40068.A1200', model: 'A1200' },
      { platform: 'Amiga', label: 'Guldkorn Expressen (AGA)', page: 'amiga-emulator.html', rom: 'roms/amiga/guldkorn_expressen/Guldkorn Expressen (1991)(Silverrock)(Dk)[f AGA CRX].adf', title: 'Guldkorn Expressen (1991, Silverrock)', bios: 'amiga/kick40068.A1200', model: 'A1200' },
      { platform: 'Amiga', label: 'Harald Hardtand', page: 'amiga-emulator.html', rom: 'roms/amiga/harald_hardtand/Harald Hardtand (1992)(Silverrock)(Da)[cr CSL].adf', title: 'Harald Hardtand (1992, Silverrock)' },
      { platform: 'Flash', label: 'Mufafa spillet', page: 'flash-emulator.html', rom: 'roms/flash/perkerspillet.swf', title: 'Mufafa spillet' },
    ];

    // Renders EMULATED_GAMES as one column per platform (in first-seen
    // order), with the platform name as that column's header. Replaces the
    // old <select id="emuPicker"> dropdown with a plain div-based layout.
    function renderEmuColumns() {
      const container = document.getElementById('emuColumns');
      if (!container) return;

      const byPlatform = new Map();
      EMULATED_GAMES.forEach((game, idx) => {
        if (!byPlatform.has(game.platform)) byPlatform.set(game.platform, []);
        byPlatform.get(game.platform).push(idx);
      });

      let html = '';
      for (const [platform, indices] of byPlatform) {
        html += `<div class="emu-column"><div class="emu-column-header">${escapeHtml(platform)}</div>`;
        for (const idx of indices) {
          html += `<a href="#" class="emu-game-link" data-idx="${idx}">${escapeHtml(EMULATED_GAMES[idx].label)}</a>`;
        }
        html += `</div>`;
      }
      container.innerHTML = html;

      container.querySelectorAll('.emu-game-link').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          const idx = parseInt(el.getAttribute('data-idx'), 10);
          openEmulatedGame(buildEmuUrl(EMULATED_GAMES[idx]));
        });
      });
    }

    // Builds the actual (percent-encoded) URL for a game entry at the moment
    // it's needed, from the plain/unencoded fields in EMULATED_GAMES. `rom`
    // and `bios` are file paths, so encodeURI is used for them (it leaves
    // "/" alone); everything else is a plain text value, so encodeURIComponent
    // is used (it also safely escapes "&", "=", "#", etc. in freeform text
    // like the `edition` note).
    function buildEmuUrl(game) {
      const parts = [];
      if (game.rom !== undefined) parts.push('rom=' + encodeURI(game.rom));
      if (game.title !== undefined) parts.push('title=' + encodeURIComponent(game.title));
      if (game.bios !== undefined) parts.push('bios=' + encodeURI(game.bios));
      if (game.model !== undefined) parts.push('model=' + encodeURIComponent(game.model));
      if (game.edition !== undefined) parts.push('edition=' + encodeURIComponent(game.edition));
      return parts.length ? `${game.page}?${parts.join('&')}` : game.page;
    }

    function openEmulatedGame(url) {
      if (!url) return;
      window.open(url, '_blank');
    }

    // Fold-out toggle for the game picker — collapsed by default so the
    // (ever-growing) game list doesn't push the search box down the page.
    function toggleEmuPicker() {
      const picker = document.getElementById('emuPicker');
      const expanded = picker.classList.toggle('expanded');
      document.getElementById('emuPickerToggle').setAttribute('aria-expanded', String(expanded));
    }

    renderEmuColumns();

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function escapeJsString(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/(['"\\])/g, '\\$1');
    }

    // Auto-start example
    // performSearch();
  </script>
</body>
</html>
