<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<title>Commodore 64 Emulator</title>

<style>

body {
 background:black;
 color:lime;
 text-align:center;
 font-family:monospace;
}

canvas {
 border:2px solid gray;
}

</style>

</head>

<body>

<h2>Commodore 64 Emulator</h2>

<canvas id="canvas" width="640" height="400"></canvas>

<script>

var Module = {

 canvas: document.getElementById("canvas"),

 locateFile: function(file) {
   return file;
 },


 arguments: [
 "-sounddev","sdl",
 "-sound",
 "-soundbufsize","8192",
 "-soundfragsize","1024",
  "-sidenginemodel","0",
   "-autostart",
   "Airwolf.T64"
 ],

 preRun: [

   function() {

     Module.FS_createPreloadedFile(
       "/",
       "Airwolf.T64",
       "Airwolf.T64",
       true,
       false
     );

   }

 ]

};

</script>

<script src="vice-resid.js"></script>

</body>

</html>
